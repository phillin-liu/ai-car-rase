name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.17.3"

jobs:
  python-syntax:
    name: Python syntax (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile every tracked Python file
        run: |
          git ls-files -z '*.py' | xargs -0 python -m compileall -q -f

      - name: Entrypoint smoke test
        run: python main.py --help >/dev/null

  python-lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      # pyproject.toml enables pycodestyle whitespace rules, pyflakes and
      # import ordering, which is what this project treats as its formatting
      # contract.
      - name: Check formatting and lint
        run: ruff check --output-format=github .

  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anticheat
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

  shell:
    name: Shell syntax & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check maintainer scripts
        run: |
          shellcheck -x \
            packaging/common.sh \
            packaging/nuitka/build.sh \
            packaging/arch/build.sh \
            packaging/deb/build.sh \
            packaging/rpm/build.sh \
            .github/scripts/make-source-archive.sh \
            .github/scripts/make-stub-dist.sh

  packaging:
    name: Package metadata (deb / rpm / exe)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm dpkg-dev

      # The Windows job needs a Windows runner, but the script itself must at
      # least parse -- a syntax error would otherwise only show up on a tag.
      - name: Syntax-check the Windows build script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath './packaging/windows/build.ps1').Path,
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'packaging/windows/build.ps1 parses cleanly'

      # Stage the packaging of a stub tree instead of compiling the whole Qt5
      # stack: this validates the spec file / control file / launcher / file
      # list in seconds, and the release jobs only add the real payload.
      - name: Build deb and rpm from a stub tree
        env:
          VERSION: "0.0.0-ci"
        run: |
          set -euo pipefail
          dist="$(.github/scripts/make-stub-dist.sh /tmp/stub.dist)"
          DIST="$dist" ./packaging/deb/build.sh --no-build
          DIST="$dist" ./packaging/rpm/build.sh --no-build

          dpkg-deb -c dist/*.deb | grep -q 'usr/lib/ai-car-rase/ai-car-rase'
          dpkg-deb -f dist/*.deb Depends | grep -q 'libc6'
          dpkg-deb -f dist/*.deb Version | grep -q '0.0.0~ci-1'
          rpm -qpl dist/*.rpm | grep -q '/usr/bin/ai-car-rase'
          rpm -qp --qf '%{VERSION}\n' dist/*.rpm | grep -q '0.0.0_ci'
          rpm -qp --requires dist/*.rpm | grep -q 'glibc'
          ls -lh dist
